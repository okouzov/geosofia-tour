<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmation e-mail — preview | GeoSofia Sightseeing Tour</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/geosofia-banner.svg">
<style>
  body{margin:0;padding:0;background:#FDF7EF;font-family:Lato,"Segoe UI",Arial,sans-serif}
  .bar{background:#1E3236;color:#FFD79A;padding:12px 18px;font-size:13px;font-weight:700;text-align:center}
  .bar a{color:#FFD79A}
  .switch{text-align:center;padding:18px 12px 0}
  .switch button{
    font:700 13px/1 Lato,"Segoe UI",Arial,sans-serif;padding:9px 16px;margin:0 4px;border-radius:999px;
    border:1.5px solid #E6DCCE;background:#fff;color:#1E3236;cursor:pointer}
  .switch button[aria-pressed="true"]{background:#3FA79C;border-color:#3FA79C;color:#fff}
</style>
</head>
<body>

<div class="bar">
  Preview only — this is exactly what the participant receives by e-mail.
  The live version is generated by <code>backend/Code.gs</code>. &nbsp;<a href="index.html">Back to the form</a>
</div>

<div class="switch">
  <button type="button" data-slot="29sep" aria-pressed="false">29 Sept</button>
  <button type="button" data-slot="30sep" aria-pressed="true">30 Sept</button>
  <button type="button" data-slot="01oct" aria-pressed="false">01 Oct</button>
</div>

<div id="mail"></div>

<script src="assets/js/config.js?v=2"></script>
<script>
(function () {
  var SAMPLE = {
    name: "Maria Petrova",
    affiliation: "University of Architecture, Civil Engineering and Geodesy",
    email: "maria.petrova@uacg.bg",
    conftool: "1042"
  };
  var FULL = {
    "29sep": "Tuesday, 29 September 2026, 18:30 - 19:30",
    "30sep": "Wednesday, 30 September 2026, 18:30 - 19:30",
    "01oct": "Thursday, 1 October 2026, 18:30 - 19:30"
  };
  var MAP = CONFIG.MEETING_POINT_URL;

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function row(k,v){
    return '<tr>'+
      '<td style="padding:11px 0;border-bottom:1px dashed #E6DCCE;font:600 12px/1.5 Lato,Segoe UI,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#7C9095;white-space:nowrap;vertical-align:top;">'+esc(k)+'</td>'+
      '<td style="padding:11px 0 11px 18px;border-bottom:1px dashed #E6DCCE;font:700 15px/1.5 Lato,Segoe UI,Arial,sans-serif;color:#1E3236;text-align:right;">'+esc(v)+'</td></tr>';
  }

  function build(slotKey){
    var r = SAMPLE, guide = CONFIG.GUIDES[slotKey], full = FULL[slotKey];
    return ''+
'<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FDF7EF;padding:28px 12px;">'+
'<tr><td align="center">'+
  '<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(30,50,54,.4);">'+
    '<tr><td style="background:#EE7A18;background-image:linear-gradient(90deg,#E4531C 0%,#EE7A18 20%,#F3A81B 42%,#E9B93C 62%,#8FB878 82%,#3FA79C 100%);padding:34px 34px 30px;text-align:center;">'+
      '<div style="font:300 34px/1.15 Lato,Segoe UI,Arial,sans-serif;color:#ffffff;letter-spacing:.5px;">GeoSofia 2026</div>'+
      '<div style="font:400 13px/1.5 Lato,Segoe UI,Arial,sans-serif;color:#FFF3E0;margin-top:8px;">28th September - 2nd October 2026 &nbsp;|&nbsp; Sofia, Bulgaria</div>'+
      '<div style="display:inline-block;margin-top:18px;padding:8px 18px;border:1px solid rgba(255,255,255,.55);border-radius:999px;font:700 12px/1 Lato,Segoe UI,Arial,sans-serif;color:#ffffff;letter-spacing:.16em;text-transform:uppercase;">Sightseeing Tour</div>'+
    '</td></tr>'+
    '<tr><td style="padding:34px 34px 6px;">'+
      '<p style="margin:0 0 14px;font:400 17px/1.6 Lato,Segoe UI,Arial,sans-serif;color:#1E3236;">Dear participant in GeoSofia 2026,</p>'+
      '<p style="margin:0 0 24px;font:400 16px/1.65 Lato,Segoe UI,Arial,sans-serif;color:#4C6469;">thank you for registration for <strong style="color:#1E3236;">GeoSofia Sightseeing Tour</strong>.</p>'+
      '<p style="margin:0 0 6px;font:700 15px/1.6 Lato,Segoe UI,Arial,sans-serif;color:#1E3236;">Your details are as follows:</p>'+
    '</td></tr>'+
    '<tr><td style="padding:6px 34px 4px;">'+
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FDF7EF;border:1px solid #E6DCCE;border-radius:13px;padding:4px 20px;">'+
        row('First and Last Name', r.name)+
        row('Affiliation', r.affiliation)+
        row('E-mail', r.email)+
        row('ConfTool Participant ID', r.conftool)+
        '<tr><td style="padding:11px 0;font:600 12px/1.5 Lato,Segoe UI,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#7C9095;vertical-align:top;">Date &amp; time</td>'+
        '<td style="padding:11px 0 11px 18px;text-align:right;"><span style="display:inline-block;background:rgba(63,167,156,.14);color:#25706A;border-radius:999px;padding:6px 14px;font:800 14px/1.4 Lato,Segoe UI,Arial,sans-serif;">'+esc(full)+'</span></td></tr>'+
      '</table>'+
    '</td></tr>'+
    '<tr><td style="padding:26px 34px 0;">'+
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #E6DCCE;border-radius:13px;">'+
        '<tr><td style="padding:20px 22px;">'+
          '<div style="font:800 12px/1.4 Lato,Segoe UI,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#C6401D;margin-bottom:10px;">Starting point location</div>'+
          '<a href="'+MAP+'" style="display:inline-block;background:#E4531C;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:10px;font:800 14px/1 Lato,Segoe UI,Arial,sans-serif;">Open the meeting point in Google Maps</a>'+
          '<div style="margin-top:12px;font:400 12px/1.6 Lato,Segoe UI,Arial,sans-serif;color:#7C9095;word-break:break-all;">'+MAP+'</div>'+
          '<div style="margin-top:10px;font:400 14px/1.6 Lato,Segoe UI,Arial,sans-serif;color:#4C6469;">Please arrive 10 minutes before the start. The tour lasts about one hour and is on foot.</div>'+
        '</td></tr>'+
      '</table>'+
    '</td></tr>'+
    '<tr><td style="padding:18px 34px 0;">'+
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:linear-gradient(180deg,#F2FAF8,#E9F5F2);background-color:#F2FAF8;border:1px solid rgba(63,167,156,.35);border-radius:13px;">'+
        '<tr><td style="padding:20px 22px;">'+
          '<div style="font:800 12px/1.4 Lato,Segoe UI,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#25706A;margin-bottom:10px;">Your Guide for the trip will be</div>'+
          '<div style="font:800 19px/1.4 Lato,Segoe UI,Arial,sans-serif;color:#1E3236;">'+esc(guide.name)+'</div>'+
          '<div style="margin-top:8px;font:400 15px/1.7 Lato,Segoe UI,Arial,sans-serif;color:#2E7F78;">'+esc(guide.phone)+'<br><a href="mailto:'+esc(guide.email)+'" style="color:#2E7F78;">'+esc(guide.email)+'</a></div>'+
        '</td></tr>'+
      '</table>'+
    '</td></tr>'+
    '<tr><td style="padding:26px 34px 30px;">'+
      '<p style="margin:0;font:400 16px/1.65 Lato,Segoe UI,Arial,sans-serif;color:#4C6469;">We are looking forward to walking through Sofia with you.</p>'+
      '<p style="margin:10px 0 0;font:700 16px/1.6 Lato,Segoe UI,Arial,sans-serif;color:#1E3236;">The GeoSofia 2026 organising team</p>'+
    '</td></tr>'+
    '<tr><td style="background:#FDF7EF;border-top:1px solid #E6DCCE;padding:20px 34px;text-align:center;">'+
      '<div style="font:400 12px/1.7 Lato,Segoe UI,Arial,sans-serif;color:#7C9095;">GeoSofia 2026 &nbsp;·&nbsp; 3D GeoInfo | Smart Data and Smart Cities | LADM &amp; 3D LA<br>28th September - 2nd October 2026 &nbsp;·&nbsp; Sofia, Bulgaria<br><span style="color:#B0BCBE;">This message was sent automatically after your tour registration.</span></div>'+
    '</td></tr>'+
  '</table>'+
'</td></tr></table>';
  }

  var buttons = document.querySelectorAll(".switch button");
  function show(key){
    document.getElementById("mail").innerHTML = build(key);
    buttons.forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.slot === key)); });
  }
  buttons.forEach(function(b){ b.addEventListener("click", function(){ show(b.dataset.slot); }); });
  show("30sep");
})();
</script>
</body>
</html>
